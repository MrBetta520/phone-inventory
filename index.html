<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>手机仓库库存管理</title>
  <link rel="stylesheet" href="styles.css?v=20260809-5">
  <style>
    /* 内容区所有操作按钮使用独立强制样式，避免旧缓存或浏览器样式变成白底白字 */
    main button:not(.delete), main .import {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 42px !important;
      background-color: #2359d6 !important;
      color: #ffffff !important;
      border: 0 !important;
      border-radius: 8px !important;
      padding: 11px 17px !important;
      font-weight: 700 !important;
      opacity: 1 !important;
      visibility: visible !important;
      cursor: pointer !important;
    }
    main button.secondary { background-color: #52657c !important; }
    #productForm button {
      min-width: 110px !important;
      white-space: nowrap !important;
    }
    .product-list .import {
      position: relative !important;
      min-width: 100px !important;
    }
    #saveAdjustmentBtn {
      grid-column: 1 / -1 !important;
      display: block !important;
      width: 100% !important;
      min-height: 46px !important;
      background: #2359d6 !important;
      color: #fff !important;
      border: 0 !important;
      border-radius: 8px !important;
      padding: 13px 16px !important;
      font-size: 15px !important;
      font-weight: bold !important;
      opacity: 1 !important;
      cursor: pointer !important;
    }
    #saveAdjustmentBtn:hover { background: #1747b8 !important; }
  </style>
</head>
<body>
<aside>
  <h2>▦ PhoneStock</h2><small>手机仓库管理</small>
  <nav>
    <button data-view="receive" class="active">入库扫码</button>
    <button data-view="customerStock">客户库存总表</button>
    <button data-view="adjust">期初 / 调整库存</button>
    <button data-view="stock">逐台库存</button>
    <button data-view="ship">出库管理</button>
    <button data-view="products">UPC 型号库</button>
  </nav>
  <p class="saved">● 数据自动保存在本机</p>
</aside>
<main>
  <header class="page-header">
    <div><h1 id="title">入库扫码</h1><p id="subtitle">选择客户后，按顺序扫描三个条码</p></div>
    <button id="exportAll">导出全部逐台记录</button>
  </header>
  <section class="metrics">
    <article>当前总库存<strong id="stockCount">0</strong>部手机</article>
    <article>今日扫码入库<strong id="todayCount">0</strong>部手机</article>
    <article>累计扫码出库<strong id="shippedCount">0</strong>部手机</article>
    <article>库存配置<strong id="modelCount">0</strong>种</article>
  </section>

  <section id="receive" class="view active">
    <div class="card">
      <h3>● 连续扫码模式 <small>客户为必选项</small></h3>
      <div class="scan-grid four">
        <label><b>客户</b><select id="receiveCustomer"><option value="">请选择客户</option></select></label>
        <label><b>1 快递单号</b><input id="tracking" placeholder="扫描 Tracking Number" autocomplete="off"></label>
        <label><b>2 手机 IMEI</b><input id="imei" placeholder="扫描 IMEI 条码" autocomplete="off"></label>
        <label><b>3 手机 UPC</b><input id="upc" placeholder="扫描 UPC 自动识别" autocomplete="off"></label>
      </div>
      <footer><span id="message">请先选择客户</span><button id="receiveBtn">确认入库</button></footer>
    </div>
    <div class="two"><div class="card"><h3>库存构成</h3><div id="stats"></div></div><div class="card"><h3>最近入库</h3><div id="recent"></div></div></div>
  </section>

  <section id="customerStock" class="view">
    <div class="card toolbar">
      <label>查看客户<select id="stockCustomerFilter"><option value="ALL">全部客户</option></select></label>
      <button id="exportCustomerToday">导出所选客户今日入库</button>
      <button id="exportCustomerStock" class="secondary">导出所选客户库存总表</button>
    </div>
    <div class="card"><div class="table" id="customerStockTable"></div></div>
  </section>

  <section id="adjust" class="view">
    <div class="card">
      <h3>录入期初库存 / 手动调整</h3>
      <form id="adjustmentForm" class="form-grid">
        <label>客户<select id="adjustCustomer" required><option value="">请选择客户</option></select></label>
        <label>型号<input id="adjustModel" placeholder="例如 iPhone 17 Pro" required></label>
        <label>颜色<input id="adjustColor" placeholder="例如 银色" required></label>
        <label>容量<input id="adjustCapacity" placeholder="例如 256GB" required></label>
        <label>操作<select id="adjustType"><option value="initial">期初库存</option><option value="increase">增加库存</option><option value="decrease">减少库存</option></select></label>
        <label>数量<input id="adjustQuantity" type="number" min="1" step="1" required></label>
        <label class="wide">备注<input id="adjustNote" placeholder="选填，例如：系统启用前库存"></label>
        <button id="saveAdjustmentBtn" type="submit">确认并加入库存总表</button>
      </form>
      <p id="adjustMessage" class="muted"></p>
    </div>
    <div class="card"><h3>调整记录</h3><div class="table" id="adjustmentTable"></div></div>
  </section>

  <section id="stock" class="view"><div class="card"><input id="stockSearch" class="search" placeholder="搜索客户、快递单号、IMEI、型号…"><div class="table" id="stockTable"></div></div></section>
  <section id="ship" class="view"><div class="card"><input id="shipSearch" class="search" placeholder="搜索客户、快递单号、IMEI、型号…"><div class="table" id="shipTable"></div></div></section>
  <section id="products" class="view">
    <div class="card"><h3>添加 / 更新 UPC</h3><form id="productForm"><input id="pUpc" placeholder="UPC 条码" required><input id="pModel" placeholder="手机型号" required><input id="pColor" placeholder="颜色" required><input id="pCapacity" placeholder="容量" required><button>保存型号</button></form></div>
    <div class="card product-list"><header><h3>已有型号</h3><label class="import">导入 CSV<input id="csvImport" type="file" accept=".csv"></label></header><p>CSV 第一行：UPC,型号,颜色,容量</p><div class="table" id="productTable"></div></div>
  </section>
</main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js?v=20260809-4"></script>
</body>
</html>
